plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gfdrps'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gfdrps.app'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs directly on a phone for testing.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
