name: Build Gf Drps APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace project files with ZIP contents
        shell: bash
        run: |
          set -euo pipefail

          archive="GfDrps-v1.9.zip"
          if [ ! -f "$archive" ]; then
            echo "ZIP not found: $archive"
            exit 1
          fi

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          unzip -q "$archive" -d "$tmp_dir"

          source_dir="$tmp_dir"
          if [ -d "$tmp_dir/$(basename "${archive%.zip}")" ]; then
            source_dir="$tmp_dir/$(basename "${archive%.zip}")"
          elif [ "$(find "$tmp_dir" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ]; then
            source_dir="$(find "$tmp_dir" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          fi

          # Remove current repo contents but keep .git and .github
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +

          # Copy extracted ZIP contents into repo root
          cp -a "$source_dir"/. .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The audio engine is plain Java, so it is tested on the CI machine before the APK is built.
      - name: Audio engine self-test
        run: |
          mkdir -p out
          javac -d out app/src/main/java/com/gfdrps/core/*.java test/SelfTest.java
          java -cp out SelfTest

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Delete ZIP after build
        if: always()
        run: |
          rm -f GfDrps-v1.9.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GfDrps-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
