name: Build Gf Drps APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The audio engine is plain Java, so it is tested on the CI machine before the APK is built.
      - name: Audio engine self-test
        run: |
          mkdir -p out
          javac -d out app/src/main/java/com/gfdrps/core/*.java test/SelfTest.java
          java -cp out SelfTest

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GfDrps-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
